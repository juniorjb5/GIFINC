text: "Pertenecer a GIFINC me ha permitido consolidar una línea de investigación en valoración financiera de proyectos aplicada a problemas reales del sector eléctrico. El grupo promueve rigor metodológico, análisis de datos y generación de conocimiento con enfoque práctico."
